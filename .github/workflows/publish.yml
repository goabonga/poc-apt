name: publish

# Packages one poc-app component and version for the Launchpad PPA, and tells
# poc-app how it went. Normally dispatched by poc-app's ci workflow right after
# it tags a release; can be run by hand.
#
#   plan       processes the payload: validates it, applies the defaults and
#              builds the matrix of series
#   source     builds the orig tarball once and commits the changelog entry
#   upload     one job per series: signs and uploads its source package
#   launchpad  waits for the Launchpad builds of what was uploaded, lists the
#              .deb files they produced and reports both to poc-app
#
# Nothing is built here: the packages poc-app releases are the ones Launchpad
# built.

on:
  workflow_dispatch:
    inputs:
      component:
        description: poc-app component to package
        required: true
        type: choice
        options: [hello, pinger]
      version:
        description: upstream version (must already be tagged "<component>-v<version>" on poc-app)
        required: true
        type: string
      series:
        description: Ubuntu series to upload for, separated by spaces or commas (all of DEFAULT_SERIES when empty)
        required: false
        type: string
      arch:
        description: architectures Launchpad builds for, separated by spaces or commas (all of DEFAULT_ARCHS when empty)
        required: false
        type: string

# A run holds this group from its plan to its last build, so that two calls
# for the same component never overlap: they would commit the same changelog
# and upload the same package. Different components do not wait for one
# another: poc-app dispatches every bumped component at roughly the same time,
# and they touch different files (the changelog commit rebases and retries
# when the other component's push got in first).
#
# A call that arrives while another one runs and another one already waits
# replaces the one that waited.
concurrency:
  group: publish-${{ github.repository }}-${{ inputs.component }}

env:
  DEFAULT_SERIES: jammy noble resolute stonking
  DEFAULT_ARCHS: amd64 arm64

jobs:
  plan:
    name: plan (${{ inputs.component }} ${{ inputs.version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      series: ${{ steps.plan.outputs.series }}
      archs: ${{ steps.plan.outputs.archs }}
      revision: ${{ steps.plan.outputs.revision }}
      ppa_upload: ${{ steps.plan.outputs.ppa_upload }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Process the payload
        id: plan
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          SERIES: ${{ inputs.series }}
          ARCHS: ${{ inputs.arch }}
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/plan-publish.py

  source:
    name: source (${{ inputs.component }} ${{ inputs.version }})
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Launchpad rejects re-uploading a version it already has ("Rejected"
      # email, no build), so every run has a revision of its own, computed
      # once by the plan and shared by every job.
      DEB_REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential devscripts debhelper golang-go

      - name: Reuse the orig tarball the PPA already has
        # Launchpad rejects, by email, an upload whose orig tarball has the
        # name of one already in the archive but other bytes, and two builds
        # of the same tree are not byte-identical: a rerun for a version
        # that was uploaded before reuses the tarball of the PPA (confirmed
        # for real, the uploads of two reruns never showed up).
        id: orig
        if: needs.plan.outputs.ppa_upload == 'true'
        env:
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          SOURCE: poc-${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          OUT: ${{ runner.temp }}/orig
        run: scripts/launchpad-orig.sh

      - name: Prepare the orig tarball and the changelog entry
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          ORIG_TARBALL: ${{ steps.orig.outputs.path }}
        run: scripts/build-source.sh "${{ inputs.component }}" "${{ inputs.version }}" -o

      - name: Commit the updated changelog
        # build-source.sh bumps packages/<component>/debian/changelog in
        # place from poc-app's own CHANGELOG.md, so the package version and
        # release notes actually track the release; the uploads check main
        # out to get it. The concurrency group does not reliably serialize
        # two workflow_dispatch calls fired within a second or two of each
        # other (confirmed for real: both runs started and ran fully
        # concurrently anyway), so the push itself has to tolerate the race
        # instead of trusting GitHub's scheduler to prevent it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/${{ inputs.component }}/debian/changelog
          git commit -m "chore(${{ inputs.component }}): bump to ${{ inputs.version }}" || { echo "nothing to commit"; exit 0; }
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $attempt/5), rebasing onto origin/main and retrying"
            sleep "$((RANDOM % 5 + 1))"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push after 5 attempts" && exit 1

      - name: Keep the orig tarball for the uploads
        # The one built here is the one every series is uploaded with:
        # Launchpad rejects a same-named orig whose bytes differ.
        uses: actions/upload-artifact@v7
        with:
          name: orig-${{ inputs.component }}-${{ inputs.version }}
          path: dist/poc-${{ inputs.component }}_${{ inputs.version }}.orig.tar.gz
          if-no-files-found: error

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
          ORIG_TARBALL: ${{ steps.orig.outputs.path }}
        run: |
          {
            echo "## Source: ${JOB_STATUS}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Component | \`${{ inputs.component }}\` |"
            echo "| Upstream version | \`${{ inputs.version }}\` |"
            echo "| Debian revision | \`${DEB_REVISION}\` |"
            if [ -n "$ORIG_TARBALL" ]; then
              echo "| Orig tarball | reused from the PPA, shared by every series |"
            else
              echo "| Orig tarball | built here, shared by every series |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: upload (${{ matrix.series }})
    needs: [plan, source]
    if: needs.plan.outputs.ppa_upload == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      # All the series at once, and a series that fails does not stop the
      # others. Launchpad's upload server answered 550 to uploads that
      # followed each other closely, so each upload is retried with a growing
      # pause.
      max-parallel: 4
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.plan.outputs.series) }}
    env:
      DEB_REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog entry the source job just committed.
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: orig-${{ inputs.component }}-${{ inputs.version }}
          path: orig

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential devscripts debhelper golang-go dput

      - name: Import and unlock the GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # dput checks the signature of what debsign just signed. A key
          # imported from a secret key export has no trust, so the check
          # ends in "Error checking signature ... SignatureVerifyError"
          # (harmless, the upload goes on); trusting our own key ends it.
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "${fingerprint}:6:" | gpg --batch --import-ownertrust
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null

      - name: Build the source package for the series
        env:
          SERIES: ${{ matrix.series }}
          ARCHS: ${{ needs.plan.outputs.archs }}
          ORIG_TARBALL: ${{ github.workspace }}/orig/poc-${{ inputs.component }}_${{ inputs.version }}.orig.tar.gz
        run: scripts/build-source.sh "${{ inputs.component }}" "${{ inputs.version }}" -S

      - name: Sign and upload it to the PPA
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PPA: ${{ vars.LAUNCHPAD_PPA }}
        run: |
          set -euo pipefail
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          version="${{ inputs.version }}-${DEB_REVISION}~${{ matrix.series }}1"
          changes="dist/poc-${{ inputs.component }}_${version}_source.changes"
          debsign -k"$KEY_ID" -p"gpg --batch --yes --passphrase $GPG_PASSPHRASE --pinentry-mode loopback" "$changes"
          # Launchpad's upload server answers "550 ... internal server error"
          # now and then, and to uploads that follow another too closely
          # (confirmed for real, for several minutes). -f because a half-sent
          # upload leaves a marker dput would refuse to retry.
          for attempt in 1 2 3 4 5; do
            if dput -f "$PPA" "$changes"; then
              echo "$version" > "uploaded-${{ matrix.series }}"
              exit 0
            fi
            echo "::warning::upload of ${{ matrix.series }} failed (attempt $attempt/5)"
            sleep "$((attempt * 30))"
          done
          echo "::error::could not upload ${{ matrix.series }}"
          exit 1

      - name: Remember what was uploaded
        uses: actions/upload-artifact@v7
        with:
          name: uploaded-${{ matrix.series }}
          path: uploaded-${{ matrix.series }}
          if-no-files-found: error

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          ARCHS: ${{ needs.plan.outputs.archs }}
        run: |
          version="${{ inputs.version }}-${DEB_REVISION}~${{ matrix.series }}1"
          {
            echo "## Upload ${{ matrix.series }}: ${JOB_STATUS}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source package | \`poc-${{ inputs.component }}\` |"
            echo "| Series | \`${{ matrix.series }}\` |"
            echo "| Version | \`${version}\` |"
            echo "| Architectures | \`${ARCHS}\` |"
            echo "| PPA | \`${PPA}\` |"
            if [ -f "uploaded-${{ matrix.series }}" ]; then
              echo "| Upload | sent to Launchpad, which builds it next |"
            else
              echo "| Upload | not sent |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Launchpad builds the uploaded source package of each series on its own,
  # minutes later and possibly failing, then publishes its binaries, much
  # later still: the jobs above only know the uploads went through. One job per
  # series follows its builds (one per architecture), tells poc-app as soon as
  # the .deb files exist, then follows the publication of the binaries, which
  # is when `apt install` starts to work.
  launchpad:
    name: launchpad (${{ matrix.series }})
    needs: [plan, source, upload]
    # Also when some uploads failed: the series that did go through still
    # have builds to follow, and the ones that did not are reported.
    if: ${{ !cancelled() && needs.plan.outputs.ppa_upload == 'true' && needs.source.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.plan.outputs.series) }}
    env:
      PPA: ${{ vars.LAUNCHPAD_PPA }}
      SOURCE: poc-${{ inputs.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: uploaded-${{ matrix.series }}
          path: uploaded

      - name: Find what was uploaded
        id: uploaded
        run: |
          version=$(cat "uploaded/uploaded-${{ matrix.series }}" 2>/dev/null || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [ -n "$version" ] || echo "::error::nothing was uploaded for ${{ matrix.series }}"

      - name: Follow the Launchpad builds
        id: build
        if: steps.uploaded.outputs.version != ''
        env:
          VERSIONS: ${{ steps.uploaded.outputs.version }}
        run: scripts/launchpad-build-status.sh

      - name: Collect the packages Launchpad built
        id: debs
        if: ${{ !cancelled() && steps.uploaded.outputs.version != '' }}
        env:
          VERSIONS: ${{ steps.uploaded.outputs.version }}
        run: scripts/launchpad-binaries.sh

      - name: Tell poc-app the packages of the series are built
        # As soon as they exist, so poc-app attaches them to the release
        # while the rest is still going on. The same fine-grained PAT as
        # above, with Contents (read/write) on poc-app for the dispatch.
        if: ${{ !cancelled() && steps.debs.outputs.debs != '' && steps.debs.outputs.debs != '[]' }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          DEBS: ${{ steps.debs.outputs.debs }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-app was not notified"
            exit 0
          fi
          gh api repos/goabonga/poc-app/dispatches \
            -f event_type=package-built \
            -f "client_payload[component]=${{ inputs.component }}" \
            -f "client_payload[version]=${{ inputs.version }}" \
            -f "client_payload[series]=${{ matrix.series }}" \
            -f "client_payload[package]=poc-${{ inputs.component }}" \
            -f "client_payload[debs]=$DEBS"

      - name: Follow the publication of the binaries
        id: published
        # A build that succeeded is not installable yet.
        if: ${{ !cancelled() && steps.build.outputs.state == 'success' }}
        env:
          VERSION: ${{ steps.uploaded.outputs.version }}
        run: scripts/launchpad-published.sh

      - name: Write what happened to the series
        id: result
        if: ${{ !cancelled() }}
        env:
          VERSION_UPLOADED: ${{ steps.uploaded.outputs.version }}
          # A build step that died leaves no state: unknown, not "not uploaded".
          STATE: ${{ steps.build.outputs.state || (steps.uploaded.outputs.version != '' && 'unknown') || 'not-uploaded' }}
          PUBLISHED: ${{ steps.published.outputs.published || 'false' }}
          BUILDS: ${{ steps.build.outputs.builds || '[]' }}
        run: |
          jq -n -c \
            --arg series "${{ matrix.series }}" \
            --arg version "$VERSION_UPLOADED" \
            --arg state "$STATE" \
            --argjson published "$PUBLISHED" \
            --argjson builds "$BUILDS" \
            '{series: $series, version: $version, state: $state, published: $published, builds: $builds}' \
            > "result-${{ matrix.series }}.json"
          cat "result-${{ matrix.series }}.json"

      - name: Keep the result for the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.series }}
          path: result-${{ matrix.series }}.json
          if-no-files-found: error

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          result="result-${{ matrix.series }}.json"
          {
            echo "## Launchpad ${{ matrix.series }}: $(jq -r 'if .state == "success" and .published then "built and published" else .state end' "$result")"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | \`poc-${{ inputs.component }}\` \`$(jq -r '.version' "$result")\` |"
            echo "| Published | $(jq -r '.published' "$result") |"
            echo
            if [ "$(jq '.builds | length' "$result")" -gt 0 ]; then
              echo "| Architecture | State | Build | Log |"
              echo "| --- | --- | --- | --- |"
              jq -r '.builds[] | "| \(.arch) | \(.state) | [page](\(.url)) | \(if .log_url != "" then "[log](\(.log_url))" else "" end) |"' "$result"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the series did not go through
        if: ${{ !cancelled() && (steps.build.outputs.state != 'success' || steps.published.outputs.published != 'true') }}
        env:
          STATE: ${{ steps.build.outputs.state || 'not uploaded' }}
          PUBLISHED: ${{ steps.published.outputs.published }}
        run: |
          echo "::error::${{ matrix.series }}: build ${STATE}, published ${PUBLISHED:-no}"
          exit 1

  # Once every series is over, one job tells poc-app how each series and
  # architecture ended: it writes the install section in the release notes,
  # opens an issue for each build that failed and publishes the release. It is
  # a single job so that only one event edits the notes.
  report:
    name: report (${{ inputs.component }} ${{ inputs.version }})
    needs: [plan, source, launchpad]
    if: ${{ !cancelled() && needs.plan.outputs.ppa_upload == 'true' && needs.source.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Assemble the results
        id: results
        env:
          SERIES: ${{ needs.plan.outputs.series }}
        run: |
          set -euo pipefail
          # A series that left no result (its job could not even start) is a
          # failure, not a series that is missing from the report.
          results="[]"
          for series in $(jq -r '.[]' <<<"$SERIES"); do
            file="results/result-${series}.json"
            if [ -f "$file" ]; then
              entry=$(cat "$file")
            else
              entry=$(jq -n -c --arg series "$series" '{series: $series, version: "", state: "missing", published: false, builds: []}')
            fi
            results=$(jq -c --argjson entry "$entry" '. + [$entry]' <<<"$results")
          done
          if [ "$(jq '[.[] | select(.state != "success" or (.published | not))] | length' <<<"$results")" -eq 0 ]; then
            status=success
          else
            status=failure
          fi
          echo "results=$results" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Tell poc-app how every series ended
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          RESULTS: ${{ steps.results.outputs.results }}
          STATUS: ${{ steps.results.outputs.status }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-app was not notified"
            exit 0
          fi
          gh api repos/goabonga/poc-app/dispatches \
            -f event_type=package-complete \
            -f "client_payload[component]=${{ inputs.component }}" \
            -f "client_payload[version]=${{ inputs.version }}" \
            -f "client_payload[package]=poc-${{ inputs.component }}" \
            -f "client_payload[ppa]=${{ vars.LAUNCHPAD_PPA }}" \
            -f "client_payload[status]=$STATUS" \
            -f "client_payload[run_url]=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "client_payload[results]=$RESULTS"

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ steps.results.outputs.results }}
          STATUS: ${{ steps.results.outputs.status }}
        run: |
          {
            echo "## Report to poc-app: ${STATUS}"
            echo
            echo "| Series | Version | State | Published | Architectures |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.series) | \(.version | if . == "" then "-" else "`" + . + "`" end) | \(.state) | \(.published) | \(.builds | map("\(.arch): \(.state)") | join(", ")) |"' <<<"$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when something did not go through
        if: ${{ steps.results.outputs.status != 'success' }}
        run: |
          echo "::error::at least one series did not build or was not published"
          exit 1
