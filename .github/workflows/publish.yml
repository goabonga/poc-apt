name: publish

# Packages one poc-app component and version for the Launchpad PPA, and tells
# poc-app how it went. Normally dispatched by poc-app's ci workflow right after
# it tags a release; can be run by hand.
#
#   plan       processes the payload: validates it, applies the defaults and
#              builds the matrix of series
#   package    builds the orig tarball and the .deb once, commits the changelog,
#              publishes the .deb as a poc-apt release and reports it to poc-app
#   upload     one job per series: signs and uploads its source package
#   launchpad  waits for the Launchpad builds of what was uploaded, and reports
#              how they ended to poc-app

on:
  workflow_dispatch:
    inputs:
      component:
        description: poc-app component to package
        required: true
        type: choice
        options: [hello, pinger]
      version:
        description: upstream version (must already be tagged "<component>-v<version>" on poc-app)
        required: true
        type: string
      series:
        description: Ubuntu series to upload for, separated by spaces or commas (all of DEFAULT_SERIES when empty)
        required: false
        type: string
      arch:
        description: architectures Launchpad builds for, separated by spaces or commas (all of DEFAULT_ARCHS when empty)
        required: false
        type: string

# A run holds this group from its plan to its last build, so that two
# components never commit their changelog at the same time (the second push
# would be rejected as non-fast-forward) nor upload to Launchpad at the same
# time (whose upload server answers 550 to overlapping uploads, confirmed for
# real). poc-app dispatches every bumped component at roughly the same time:
# the second one waits for the first.
concurrency:
  group: publish-${{ github.repository }}

env:
  DEFAULT_SERIES: jammy noble resolute stonking
  DEFAULT_ARCHS: amd64 arm64

jobs:
  plan:
    name: plan (${{ inputs.component }} ${{ inputs.version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      series: ${{ steps.plan.outputs.series }}
      archs: ${{ steps.plan.outputs.archs }}
      revision: ${{ steps.plan.outputs.revision }}
      ppa_upload: ${{ steps.plan.outputs.ppa_upload }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Process the payload
        id: plan
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          SERIES: ${{ inputs.series }}
          ARCHS: ${{ inputs.arch }}
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/plan-publish.py

  package:
    name: package (${{ inputs.component }} ${{ inputs.version }})
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Launchpad rejects re-uploading a version it already has ("Rejected"
      # email, no build), so every run has a revision of its own, computed
      # once by the plan and shared by every job.
      DEB_REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential devscripts debhelper golang-go

      - name: Build the orig tarball and the .deb
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: scripts/build-source.sh "${{ inputs.component }}" "${{ inputs.version }}" -b

      - name: Commit the updated changelog
        # build-source.sh bumps packages/<component>/debian/changelog in
        # place from poc-app's own CHANGELOG.md before building, so the
        # package version and release notes actually track the release. The
        # concurrency group does not reliably serialize two workflow_dispatch
        # calls fired within a second or two of each other (confirmed for
        # real: both runs started and ran fully concurrently anyway), so the
        # push itself has to tolerate the race instead of trusting GitHub's
        # scheduler to prevent it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/${{ inputs.component }}/debian/changelog
          git commit -m "chore(${{ inputs.component }}): bump to ${{ inputs.version }}" || { echo "nothing to commit"; exit 0; }
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $attempt/5), rebasing onto origin/main and retrying"
            sleep "$((RANDOM % 5 + 1))"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push after 5 attempts" && exit 1

      - name: Keep the orig tarball for the uploads
        # The one built here is the one every series is uploaded with:
        # Launchpad rejects a same-named orig whose bytes differ.
        uses: actions/upload-artifact@v7
        with:
          name: orig-${{ inputs.component }}-${{ inputs.version }}
          path: dist/poc-${{ inputs.component }}_${{ inputs.version }}.orig.tar.gz
          if-no-files-found: error

      - name: Publish the .deb as a poc-apt release
        # A stable download URL for the callback below, independent of
        # whether the PPA secrets are configured - the dispatch loop back
        # to poc-app should work even before a real Launchpad PPA exists.
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.component }}-v${{ inputs.version }}"
          deb="dist/poc-${{ inputs.component }}_${{ inputs.version }}-${{ env.DEB_REVISION }}_amd64.deb"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            # A rerun for a version that already got this far (a failed
            # upload to the PPA, say). The .deb of each run has its own
            # Debian revision and poc-app takes the first asset of the
            # release, so the release is left with the new .deb only.
            for asset in $(gh release view "$tag" --repo "${{ github.repository }}" \
              --json assets -q ".assets[].name"); do
              gh release delete-asset "$tag" "$asset" --yes --repo "${{ github.repository }}"
            done
            gh release upload "$tag" "$deb" --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$deb" --title "$tag" \
              --notes "Debian package built from poc-app@$tag." \
              --repo "${{ github.repository }}"
          fi
          # The plain "url" field (gh's name for the raw REST API's
          # "browser_download_url") doesn't accept a Bearer token for a
          # private repo's asset - confirmed for real, 404 regardless of
          # -L. "apiUrl" (the /repos/.../releases/assets/<id> endpoint)
          # does, with an Accept: application/octet-stream header -
          # that's what package-published.yml fetches with.
          url=$(gh release view "$tag" --repo "${{ github.repository }}" \
            --json assets -q ".assets[0].apiUrl")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report back to poc-app
        # CROSS_REPO_TOKEN is the same fine-grained PAT poc-app uses to
        # trigger this workflow, with Contents (read/write) on poc-app too
        # so it can fire this repository_dispatch.
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-app was not notified"
            exit 0
          fi
          gh api repos/goabonga/poc-app/dispatches \
            -f event_type=package-published \
            -f "client_payload[component]=${{ inputs.component }}" \
            -f "client_payload[version]=${{ inputs.version }}" \
            -f "client_payload[kind]=apt" \
            -f "client_payload[package]=poc-${{ inputs.component }}" \
            -f "client_payload[ppa]=${{ vars.LAUNCHPAD_PPA }}" \
            -f "client_payload[url]=${{ steps.github_release.outputs.url }}"

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Package: ${JOB_STATUS}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Component | \`${{ inputs.component }}\` |"
            echo "| Upstream version | \`${{ inputs.version }}\` |"
            echo "| Debian revision | \`${DEB_REVISION}\` |"
            echo "| Release | [\`${{ inputs.component }}-v${{ inputs.version }}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ inputs.component }}-v${{ inputs.version }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: upload (${{ matrix.series }})
    needs: [plan, package]
    if: needs.plan.outputs.ppa_upload == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      # One series at a time, and a series that fails does not stop the
      # others. Launchpad's upload server answers 550 to uploads that overlap.
      max-parallel: 1
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.plan.outputs.series) }}
    env:
      DEB_REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog entry the package job just committed.
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: orig-${{ inputs.component }}-${{ inputs.version }}
          path: orig

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential devscripts debhelper golang-go dput

      - name: Import and unlock the GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # dput checks the signature of what debsign just signed. A key
          # imported from a secret key export has no trust, so the check
          # ends in "Error checking signature ... SignatureVerifyError"
          # (harmless, the upload goes on); trusting our own key ends it.
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "${fingerprint}:6:" | gpg --batch --import-ownertrust
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null

      - name: Build the source package for the series
        env:
          SERIES: ${{ matrix.series }}
          ARCHS: ${{ needs.plan.outputs.archs }}
          ORIG_TARBALL: ${{ github.workspace }}/orig/poc-${{ inputs.component }}_${{ inputs.version }}.orig.tar.gz
        run: scripts/build-source.sh "${{ inputs.component }}" "${{ inputs.version }}" -S

      - name: Sign and upload it to the PPA
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PPA: ${{ vars.LAUNCHPAD_PPA }}
        run: |
          set -euo pipefail
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          version="${{ inputs.version }}-${DEB_REVISION}~${{ matrix.series }}1"
          changes="dist/poc-${{ inputs.component }}_${version}_source.changes"
          debsign -k"$KEY_ID" -p"gpg --batch --yes --passphrase $GPG_PASSPHRASE --pinentry-mode loopback" "$changes"
          # Launchpad's upload server answers "550 ... internal server error"
          # now and then, and to uploads that follow another too closely
          # (confirmed for real, for several minutes). -f because a half-sent
          # upload leaves a marker dput would refuse to retry.
          for attempt in 1 2 3 4 5; do
            if dput -f "$PPA" "$changes"; then
              echo "$version" > "uploaded-${{ matrix.series }}"
              exit 0
            fi
            echo "::warning::upload of ${{ matrix.series }} failed (attempt $attempt/5)"
            sleep "$((attempt * 30))"
          done
          echo "::error::could not upload ${{ matrix.series }}"
          exit 1

      - name: Remember what was uploaded
        uses: actions/upload-artifact@v7
        with:
          name: uploaded-${{ matrix.series }}
          path: uploaded-${{ matrix.series }}
          if-no-files-found: error

  # Launchpad builds the uploaded source packages on its own, minutes later and
  # possibly failing: the jobs above only know the uploads went through. This
  # one follows the builds of every series and architecture.
  launchpad:
    name: launchpad build (${{ inputs.component }} ${{ inputs.version }})
    needs: [plan, package, upload]
    # Also when some uploads failed: the series that did go through still
    # have builds to follow.
    if: ${{ !cancelled() && needs.plan.outputs.ppa_upload == 'true' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: uploaded-*
          path: uploaded
          merge-multiple: true

      - name: List what was uploaded
        id: uploaded
        run: |
          versions=$(cat uploaded/uploaded-* 2>/dev/null | tr '\n' ' ' | sed 's/ $//' || true)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          {
            echo "## Uploads: ${{ needs.upload.result }}"
            echo
            echo "Series asked for: $(echo '${{ needs.plan.outputs.series }}' | jq -r 'join(", ")')"
            echo "Architectures: ${{ needs.plan.outputs.archs }}"
            echo
            if [ -n "$versions" ]; then
              echo "Uploaded: ${versions// /, }"
            else
              echo "Nothing was uploaded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the Launchpad builds
        id: build
        if: steps.uploaded.outputs.versions != ''
        env:
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          SOURCE: poc-${{ inputs.component }}
          VERSIONS: ${{ steps.uploaded.outputs.versions }}
        run: scripts/launchpad-build-status.sh

      - name: Tell poc-app how the build ended
        # Sent whatever the outcome, so poc-app learns about a failure too.
        # The same fine-grained PAT as above, with Contents (read/write) on
        # poc-app for the repository_dispatch.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          # A series that could not be uploaded is a failure, whatever the
          # builds of the others say.
          STATE: ${{ needs.upload.result != 'success' && 'failure' || steps.build.outputs.state || 'failure' }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
          LOG_URL: ${{ steps.build.outputs.log_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-app was not notified"
            exit 0
          fi
          gh api repos/goabonga/poc-app/dispatches \
            -f event_type=package-build \
            -f "client_payload[component]=${{ inputs.component }}" \
            -f "client_payload[version]=${{ inputs.version }}" \
            -f "client_payload[kind]=apt" \
            -f "client_payload[status]=$STATE" \
            -f "client_payload[url]=$BUILD_URL" \
            -f "client_payload[log_url]=$LOG_URL"

      - name: Fail when something did not go through
        if: ${{ needs.upload.result != 'success' || steps.build.outputs.state != 'success' }}
        env:
          UPLOADS: ${{ needs.upload.result }}
          STATE: ${{ steps.build.outputs.state }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
        run: |
          echo "::error::uploads ${UPLOADS}, Launchpad build ${STATE:-not followed}: ${BUILD_URL}"
          exit 1
