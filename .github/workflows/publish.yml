name: publish

# Builds the Debian source + binary package for one poc-app component and
# version, publishes the .deb as a poc-apt release (a stable URL regardless
# of PPA configuration), uploads the source package to the Launchpad PPA
# when GPG signing secrets are configured, waits for the Launchpad build, and
# reports back to poc-app, both that the package is available and how the
# Launchpad build ended.
# Can be run by hand, but is normally dispatched by poc-app's release
# workflow right after it tags a release.

on:
  workflow_dispatch:
    inputs:
      component:
        description: poc-app component to package
        required: true
        type: choice
        options: [hello, pinger]
      version:
        description: upstream version (must already be tagged "<component>-v<version>" on poc-app)
        required: true
        type: string

# poc-app dispatches every bumped component at roughly the same time, and
# each run commits to the same main branch ("Commit the updated
# changelog"). Without this, two concurrent runs race: whichever pushes
# second gets a non-fast-forward rejection, since it checked out main
# before the first run's commit landed - confirmed for real on poc-aur's
# identical pattern (greeter's run pushed fine, pinger's failed seconds
# later on the same branch).
concurrency:
  group: publish-${{ github.repository }}

jobs:
  build:
    name: build (${{ inputs.component }} ${{ inputs.version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      # The full Debian version uploaded to the PPA; empty when nothing was
      # uploaded, which skips the Launchpad job.
      source_version: ${{ steps.upload.outputs.source_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute a unique Debian revision
        # Launchpad rejects re-uploading a version it already has
        # ("Rejected" email, no build) - confirmed for real, hit
        # repeatedly while re-testing the same poc-app version. Computed
        # once and shared (via $GITHUB_ENV) by both build-source.sh calls
        # below, so one publish run produces one consistent version.
        run: echo "DEB_REVISION=1+test$(date +%s)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential devscripts debhelper golang-go

      - name: Build source + binary package
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: scripts/build-source.sh "${{ inputs.component }}" "${{ inputs.version }}" -b

      - name: Commit the updated changelog
        # build-source.sh bumps packages/<component>/debian/changelog in
        # place from poc-app's own CHANGELOG.md before building, so the
        # package version and release notes actually track the release.
        # The concurrency group above doesn't reliably serialize two
        # workflow_dispatch calls fired within a second or two of each
        # other (confirmed for real on poc-aur's identical step: both
        # runs started and ran fully concurrently anyway), so the push
        # itself has to tolerate the race instead of trusting GitHub's
        # scheduler to prevent it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/${{ inputs.component }}/debian/changelog
          git commit -m "chore(${{ inputs.component }}): bump to ${{ inputs.version }}" || { echo "nothing to commit"; exit 0; }
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $attempt/5), rebasing onto origin/main and retrying"
            sleep "$((RANDOM % 5 + 1))"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push after 5 attempts" && exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: poc-${{ inputs.component }}_${{ inputs.version }}
          path: dist/*

      - name: Publish the .deb as a poc-apt release
        # A stable download URL for the callback below, independent of
        # whether the PPA secrets are configured - the dispatch loop back
        # to poc-app should work even before a real Launchpad PPA exists.
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.component }}-v${{ inputs.version }}"
          deb="dist/poc-${{ inputs.component }}_${{ inputs.version }}-${{ env.DEB_REVISION }}_amd64.deb"
          gh release create "$tag" "$deb" --title "$tag" \
            --notes "Debian package built from poc-app@$tag." \
            --repo "${{ github.repository }}"
          # The plain "url" field (gh's name for the raw REST API's
          # "browser_download_url") doesn't accept a Bearer token for a
          # private repo's asset - confirmed for real, 404 regardless of
          # -L. "apiUrl" (the /repos/.../releases/assets/<id> endpoint)
          # does, with an Accept: application/octet-stream header -
          # that's what package-published.yml fetches with.
          url=$(gh release view "$tag" --repo "${{ github.repository }}" \
            --json assets -q ".assets[0].apiUrl")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ] && [ -n "${{ vars.LAUNCHPAD_PPA }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GPG secrets or vars.LAUNCHPAD_PPA unset; built locally only, not uploaded to the PPA"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null

      - name: Sign and upload source package to the PPA
        id: upload
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          scripts/build-source.sh "${{ inputs.component }}" "${{ inputs.version }}" -S
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          debsign -k"$KEY_ID" -p"gpg --batch --yes --passphrase $GPG_PASSPHRASE --pinentry-mode loopback" \
            dist/poc-${{ inputs.component }}_${{ inputs.version }}-${{ env.DEB_REVISION }}_source.changes
          dput "${{ vars.LAUNCHPAD_PPA }}" \
            dist/poc-${{ inputs.component }}_${{ inputs.version }}-${{ env.DEB_REVISION }}_source.changes
          echo "source_version=${{ inputs.version }}-${{ env.DEB_REVISION }}" >> "$GITHUB_OUTPUT"

      - name: Report back to poc-app
        # CROSS_REPO_TOKEN is the same fine-grained PAT poc-app uses to
        # trigger this workflow, with Contents (read/write) on poc-app too
        # so it can fire this repository_dispatch.
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-app was not notified"
            exit 0
          fi
          gh api repos/goabonga/poc-app/dispatches \
            -f event_type=package-published \
            -f "client_payload[component]=${{ inputs.component }}" \
            -f "client_payload[version]=${{ inputs.version }}" \
            -f "client_payload[kind]=apt" \
            -f "client_payload[package]=poc-${{ inputs.component }}" \
            -f "client_payload[ppa]=${{ vars.LAUNCHPAD_PPA }}" \
            -f "client_payload[url]=${{ steps.github_release.outputs.url }}"

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          SOURCE_VERSION: ${{ steps.upload.outputs.source_version }}
        run: |
          {
            echo "## Package build: ${JOB_STATUS}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Component | \`${{ inputs.component }}\` |"
            echo "| Upstream version | \`${{ inputs.version }}\` |"
            echo "| Debian version | \`${{ inputs.version }}-${DEB_REVISION}\` |"
            echo "| Release | [\`${{ inputs.component }}-v${{ inputs.version }}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ inputs.component }}-v${{ inputs.version }}) |"
            if [ -n "$SOURCE_VERSION" ]; then
              echo "| PPA upload | \`${SOURCE_VERSION}\` to \`${PPA}\`, built by the launchpad job |"
            else
              echo "| PPA upload | skipped (no signing secrets or LAUNCHPAD_PPA) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Launchpad builds the uploaded source package on its own, minutes later and
  # possibly failing: the job above only knows the upload went through. This
  # one follows the build, in a job of its own so that the long wait does not
  # hold the concurrency group the changelog commits are serialised by.
  launchpad:
    name: launchpad build (${{ inputs.component }} ${{ inputs.version }})
    needs: build
    if: needs.build.outputs.source_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for the Launchpad build
        id: build
        env:
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          SOURCE: poc-${{ inputs.component }}
          VERSION: ${{ needs.build.outputs.source_version }}
        run: scripts/launchpad-build-status.sh

      - name: Tell poc-app how the build ended
        # Sent whatever the outcome, so poc-app learns about a failure too.
        # The same fine-grained PAT as above, with Contents (read/write) on
        # poc-app for the repository_dispatch.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          STATE: ${{ steps.build.outputs.state || 'failure' }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
          LOG_URL: ${{ steps.build.outputs.log_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.CROSS_REPO_TOKEN unset; poc-app was not notified"
            exit 0
          fi
          gh api repos/goabonga/poc-app/dispatches \
            -f event_type=package-build \
            -f "client_payload[component]=${{ inputs.component }}" \
            -f "client_payload[version]=${{ inputs.version }}" \
            -f "client_payload[kind]=apt" \
            -f "client_payload[status]=$STATE" \
            -f "client_payload[url]=$BUILD_URL" \
            -f "client_payload[log_url]=$LOG_URL"

      - name: Fail when the build did not succeed
        if: steps.build.outputs.state != 'success'
        env:
          STATE: ${{ steps.build.outputs.state }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
        run: |
          echo "::error::Launchpad build ${STATE:-did not report}: ${BUILD_URL}"
          exit 1
