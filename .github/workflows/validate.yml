name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (${{ matrix.component }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [hello, pinger]
    steps:
      - uses: actions/checkout@v7
      - name: Install devscripts and python3-debian
        run: sudo apt-get update -qq && sudo apt-get install -y -qq devscripts python3-debian
      - name: Parse changelog
        run: dpkg-parsechangelog -l packages/${{ matrix.component }}/debian/changelog
      - name: Parse control
        run: |
          python3 -c "
          from debian.deb822 import Deb822
          with open('packages/${{ matrix.component }}/debian/control') as f:
              for para in Deb822.iter_paragraphs(f):
                  assert para, 'empty stanza'
          print('control OK')
          "
      - name: debian/rules is executable
        run: test -x packages/${{ matrix.component }}/debian/rules
